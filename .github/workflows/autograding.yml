name: Assignment 6 Autograding

on:
  push:
    paths:
      - 'Assignment_6/**'
      - '.github/workflows/autograding.yml'
  workflow_dispatch:

jobs:
  autograding:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Database
        run: |
          mysql -h 127.0.0.1 -u root -proot < Assignment_6/starter.sql

      - name: Run Student Answer
        run: |
          mysql -h 127.0.0.1 -u root -proot CollegeDB < Assignment_6/answer.sql

      - name: Run Test Cases
        run: |
          mysql -h 127.0.0.1 -u root -proot CollegeDB < Assignment_6/test.sql

      - name: Display Final Result
        run: |
          mysql -h 127.0.0.1 -u root -proot CollegeDB -e "SELECT * FROM Student;"
