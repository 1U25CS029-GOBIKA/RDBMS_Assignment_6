

on:
  push:
    paths:
      - 'Assignment_6/answer.sql'
      - 'Assignment_6/test.sql'
      - '.github/workflows/autograding.yml'
  workflow_dispatch:

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MySQL
        run: |
          sudo systemctl start mysql
          mysql --version

      - name: Create Database and Initial Data
        run: |
          mysql -h 127.0.0.1 -u root -proot < Assignment_6/starter.sql

      - name: Run Student Answer
        run: |
          mysql -h 127.0.0.1 -u root -proot CollegeDB < Assignment_6/answer.sql

      - name: Run Test Cases
        run: |
          mysql -h 127.0.0.1 -u root -proot CollegeDB < Assignment_6/test.sql > test_output.txt

      - name: Display Test Results
        run: |
          cat test_output.txt

      - name: Validate Test Results
        run: |
          if grep -q "1" test_output.txt && \
             grep -q "0" test_output.txt && \
             grep -q "2" test_output.txt; then
            echo "All test cases passed!"
          else
            echo "Test cases failed!"
            exit 1
          fi
